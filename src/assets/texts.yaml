texts:
  promise-info:
    yes:
      m: |
        Župan <strong>{{ mayor_name }}</strong> že omogoča občanom soodločanje o
        porabi dela občinskih sredstev in jih vključuje v soustvarjanje
        lokalnega okolja.
      f: |
        Županja <strong>{{ mayor_name }}</strong> že omogoča občanom soodločanje
        o porabi dela občinskih sredstev in jih vključuje v soustvarjanje
        lokalnega okolja.
    waiting:
      m: |
        Župan <strong>{{ mayor_name }}</strong> se je zavezal, da bo občanom
        omogočil soodločanje o porabi dela občinskih sredstev in jih vključil v
        soustvarjanje lokalnega okolja, a tega za zdaj še ni uresničil.
      f: |
        Županja <strong>{{ mayor_name }}</strong> se je zavezala, da bo občanom
        omogočila soodločanje o porabi dela občinskih sredstev in jih vključila
        v soustvarjanje lokalnega okolja, a tega za zdaj še ni uresničila.
    no:
      m: |
        Župan <strong>{{ mayor_name }}</strong> za zdaj ne kaže pripravljenosti,
        da bi občanom omogočil soodločanje o porabi dela občinskih sredstev in
        jih vključil v soustvarjanje lokalnega okolja.
      f: |
        Županja <strong>{{ mayor_name }}</strong> za zdaj ne kaže
        pripravljenosti, da bi občanom omogočila soodločanje o porabi dela
        občinskih sredstev in jih vključila v soustvarjanje lokalnega okolja.
  cta:
    yes: >
      Veseli nas, da {{ municipality_name }} že izvaja participativni proračun in s tem občankam in občanom omogoča soodločanje o porabi dela občinskih sredstev ter jih vključuje v soustvarjanje lokalnega okolja.


      Participativni proračun prinaša številne koristi, saj povečuje učinkovitost porabe sredstev, spodbuja hitrejšo gospodarsko rast, zmanjšuje socialne razlike, omogoča boljše upravljanje z infrastrukturo in krepi občutek pripadnosti lokalni skupnosti. Poleg tega povečuje zaupanje v demokratične procese in spodbuja aktivno sodelovanje občank in občanov.


      Več o procesu participativnega proračuna v občini: {{ evidence_links }}.
    waiting: >
      Spoštovani,


      želim vas opomniti na vašo obljubo pred lokalnimi volitvami 2022, s katero ste se javno zavezali, da boste v primeru izvolitve v svojem mandatu uvedli participativni proračun.


      Ta proces demokratičnega soodločanja, v katerem občanke in občani neposredno odločajo o porabi dela proračunskih sredstev, že izvaja 66 slovenskih občin in želim si, da bi se jim pridružila tudi {{ municipality_name }}.


      Participativni proračun prinaša številne koristi, saj povečuje učinkovitost porabe sredstev, spodbuja hitrejšo gospodarsko rast, zmanjšuje socialne razlike, omogoča boljše upravljanje z infrastrukturo in krepi občutek pripadnosti lokalni skupnosti. Poleg tega povečuje zaupanje v demokratične procese in spodbuja aktivno sodelovanje občank in občanov.


      Pregled trenutnega stanja razširjenosti participativnega proračuna v Sloveniji lahko najdete na: https://participativni-proracun.danesjenovdan.si/.


      V upanju, da boste izpolnili svojo zavezo volivkam in volivcem, vas lepo pozdravljam.
    no: >
      Spoštovani,


      pišem vam z namenom, da vas opomnim na participativni proračun.


      Ta proces demokratičnega soodločanja, v katerem občanke in občani neposredno odločajo o porabi dela proračunskih sredstev, že izvaja 66 slovenskih občin in želim si, da bi se jim pridružila tudi {{ municipality_name }}.


      Participativni proračun prinaša številne koristi, saj povečuje učinkovitost porabe sredstev, spodbuja hitrejšo gospodarsko rast, zmanjšuje socialne razlike, omogoča boljše upravljanje z infrastrukturo in krepi občutek pripadnosti lokalni skupnosti. Poleg tega povečuje zaupanje v demokratične procese in spodbuja aktivno sodelovanje občank in občanov.


      Pregled trenutnega stanja razširjenosti participativnega proračuna v Sloveniji lahko najdete na: https://participativni-proracun.danesjenovdan.si/.


      V upanju, da boste kmalu začeli z izvajanjem participativnega proračuna, vas lepo pozdravljam.
