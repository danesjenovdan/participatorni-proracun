apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pp-volitve-2022
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://participativni-proracun.djnd.si, https://participativni-proracun.danesjenovdan.si"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^(/2022/zaobljube)$ $1/ redirect; # add trailing slash
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - participativni-proracun.djnd.si
        - participativni-proracun.danesjenovdan.si
      secretName: pp-volitve-2022-tls
  rules:
    - host: participativni-proracun.djnd.si
      http:
        paths:
          - path: /2022/zaobljube(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: pp-volitve-2022
                port:
                  number: 3000
    - host: participativni-proracun.danesjenovdan.si
      http:
        paths:
          - path: /2022/zaobljube(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: pp-volitve-2022
                port:
                  number: 3000
