apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pp-preverjamo-2025
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://pp2025.lb.djnd.si, https://pp2025.lb.djnd.si"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pp2025.lb.djnd.si
      secretName: pp-preverjamo-2025-tls
  rules:
    - host: pp2025.lb.djnd.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pp-preverjamo-2025
                port:
                  number: 3000
