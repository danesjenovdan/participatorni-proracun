apiVersion: apps/v1
kind: Deployment
metadata:
  name: pp-preverjamo-2025
  labels:
    app: pp-preverjamo-2025
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pp-preverjamo-2025
  template:
    metadata:
      labels:
        app: pp-preverjamo-2025
    spec:
      containers:
        - name: pp-preverjamo-2025
          image: pp-preverjamo-2025
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 100Mi
              cpu: 100m
          env:
            - name: BASE_URL
              value: /
            - name: VITE_CANONICAL_URL
              value: https://pp2025.lb.djnd.si
